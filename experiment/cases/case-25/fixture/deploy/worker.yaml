apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble-push-worker
  labels:
    app: pebble-push-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pebble-push-worker
  template:
    metadata:
      labels:
        app: pebble-push-worker
    spec:
      containers:
        - name: worker
          image: registry.pebbleapp.io/api:latest
          command: ["/worker"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pebble-db
                  key: url
            - name: PUSH_GATEWAY_URL
              value: http://push-gateway.internal:8080
            - name: PUSH_TIMEOUT
              value: 4s
            - name: CACHE_SIZE
              value: "250000"
            - name: CACHE_TTL
              value: 10m
          resources:
            limits:
              memory: 512Mi
