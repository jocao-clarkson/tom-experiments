[project]
name = "pacer-api"
version = "5.2.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pacer-auth>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
